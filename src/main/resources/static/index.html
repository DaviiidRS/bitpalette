<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitPalette | Creative Studio Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }
        .glass { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(12px); }
        .active-nav { @apply bg-indigo-600 text-white shadow-lg shadow-indigo-200; }
        .heart-active { @apply text-red-500 fill-red-500 scale-110; }
        @keyframes bell-bounce { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(15deg); } 75% { transform: rotate(-15deg); } }
        .animate-bell { animation: bell-bounce 0.5s ease-in-out 2; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900">

<div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-white">
    <div class="max-w-md w-full p-10 text-center">
        <div class="w-24 h-24 bg-indigo-600 rounded-[2.5rem] flex items-center justify-center text-white mx-auto mb-8 shadow-2xl shadow-indigo-200">
            <i data-lucide="palette" class="w-12 h-12"></i>
        </div>
        <h1 class="text-4xl font-extrabold mb-4 tracking-tight text-slate-900">BitPalette</h1>
        <p class="text-slate-400 mb-8 font-medium">Ingresa para empezar a compartir tu arte</p>
        <input type="text" id="username" value="Juan David Ramírez" class="w-full p-5 rounded-2xl bg-slate-50 border-2 border-slate-100 mb-6 focus:border-indigo-600 outline-none transition-all text-center font-bold text-lg">
        <button onclick="startApp()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-bold hover:bg-indigo-600 transition-all shadow-xl active:scale-95">Abrir Studio</button>
    </div>
</div>

<div id="main-app" class="hidden flex min-h-screen">

    <aside class="w-80 bg-white border-r border-slate-100 p-8 flex flex-col sticky top-0 h-screen z-40">
        <div class="flex items-center gap-3 mb-12 cursor-pointer" onclick="showFeed()">
            <div class="bg-indigo-600 p-2 rounded-xl text-white shadow-md"><i data-lucide="palette" class="w-5 h-5"></i></div>
            <span class="font-bold text-2xl tracking-tighter text-slate-900">BitPalette</span>
        </div>

        <nav class="space-y-10 flex-grow">
            <div>
                <h4 class="text-[10px] font-bold text-slate-400 uppercase mb-4 tracking-[0.2em]">Menú</h4>
                <button onclick="showFeed()" id="nav-feed" class="flex items-center gap-4 w-full p-4 rounded-2xl font-bold transition-all active-nav">
                    <i data-lucide="layout" class="w-5 h-5"></i> Dashboard
                </button>
            </div>

            <div>
                <h4 class="text-[10px] font-bold text-slate-400 uppercase mb-4 tracking-[0.2em]">Siguiendo</h4>
                <div id="following-list" class="space-y-2">
                </div>
            </div>
        </nav>

        <div class="pt-8 border-t border-slate-100">
            <div class="flex items-center gap-4 p-4 bg-slate-50 rounded-2xl border border-slate-100">
                <div class="w-10 h-10 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold" id="user-avatar">JD</div>
                <div class="overflow-hidden">
                    <p class="font-bold text-sm truncate" id="user-name">Cargando...</p>
                    <p class="text-[10px] text-indigo-500 font-bold uppercase tracking-wider">Systems Engineer</p>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-grow p-12 max-w-7xl mx-auto">

        <div id="view-feed" class="space-y-12 animate-in fade-in duration-500">
            <header class="flex justify-between items-center">
                <div>
                    <h2 class="text-4xl font-extrabold tracking-tight text-slate-900">Creative Feed</h2>
                    <p class="text-slate-400 font-medium">Inspiración en tiempo real</p>
                </div>

                <div class="relative">
                    <button onclick="toggleNotif()" id="bell-btn" class="p-4 bg-white border border-slate-200 rounded-2xl shadow-sm hover:bg-slate-50 transition-all relative">
                        <i data-lucide="bell" class="w-6 h-6 text-slate-600"></i>
                        <span id="notif-count" class="hidden absolute top-3 right-3 w-4 h-4 bg-red-500 text-white text-[10px] font-bold flex items-center justify-center rounded-full border-2 border-white">0</span>
                    </button>

                    <div id="notif-panel" class="hidden absolute right-0 mt-4 w-80 bg-white rounded-3xl shadow-2xl border border-slate-100 z-50 overflow-hidden">
                        <div class="p-5 border-b border-slate-50 flex justify-between items-center bg-slate-50/50">
                            <span class="font-bold text-sm text-slate-700">Notificaciones</span>
                            <button onclick="clearNotifs()" class="text-[10px] font-bold text-indigo-600 uppercase hover:underline">Limpiar</button>
                        </div>
                        <div id="notif-items" class="max-h-80 overflow-y-auto">
                            <p id="notif-empty" class="text-center text-slate-400 py-10 text-xs italic">No hay actividad nueva</p>
                        </div>
                    </div>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
                <div class="lg:col-span-2 space-y-10">
                    <div class="bg-white p-10 rounded-[2.5rem] border border-slate-100 shadow-sm">
                        <div class="flex items-center gap-8">
                            <div id="preview-container" class="w-36 h-36 bg-slate-50 rounded-[2rem] border-2 border-dashed border-slate-200 flex items-center justify-center overflow-hidden cursor-pointer group hover:border-indigo-400 transition-all" onclick="document.getElementById('file-input').click()">
                                <i data-lucide="image-plus" class="text-slate-300 w-10 h-10 group-hover:scale-110 transition-all"></i>
                                <img id="img-preview" class="hidden w-full h-full object-cover">
                            </div>
                            <input type="file" id="file-input" class="hidden" onchange="previewFile()">

                            <div class="flex-grow space-y-5">
                                <input type="text" id="art-name" placeholder="¿Cómo se llama tu obra?" class="w-full text-2xl font-bold outline-none placeholder:text-slate-200 bg-transparent">
                                <div class="flex justify-between items-center pt-2">
                                    <div class="flex gap-2 text-slate-300"><i data-lucide="image" class="w-4 h-4"></i> <i data-lucide="paperclip" class="w-4 h-4"></i></div>
                                    <button onclick="publish()" id="btn-publish" class="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-bold hover:shadow-2xl hover:shadow-indigo-100 transition-all active:scale-95">Publicar</button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="feed-items" class="space-y-10">
                    </div>
                </div>

                <aside class="space-y-8">
                    <div class="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm">
                        <h3 class="font-bold text-slate-800 mb-8 flex items-center gap-2"><i data-lucide="sparkles" class="w-4 h-4 text-amber-500"></i> Sugerencias</h3>
                        <div class="space-y-8" id="suggestions-list"></div>
                    </div>
                </aside>
            </div>
        </div>

        <div id="view-profile" class="hidden space-y-12 animate-in slide-in-from-right-10 duration-500">
            <button onclick="showFeed()" class="flex items-center gap-2 text-slate-400 font-bold hover:text-indigo-600 transition-all">
                <i data-lucide="arrow-left" class="w-5 h-5"></i> Volver al Feed
            </button>

            <header class="flex items-end gap-10 bg-white p-12 rounded-[3.5rem] border border-slate-100 shadow-sm relative overflow-hidden">
                <div id="prof-avatar" class="w-40 h-40 rounded-[2.5rem] flex items-center justify-center text-5xl font-black text-white shadow-2xl relative z-10"></div>
                <div class="flex-grow pb-2 relative z-10">
                    <h2 id="prof-name" class="text-5xl font-extrabold text-slate-900 mb-2">Artista</h2>
                    <p class="text-slate-400 font-semibold mb-6">Digital Art Specialist</p>
                    <div class="flex gap-10">
                        <div><span class="block font-black text-2xl text-indigo-600" id="prof-count">0</span><span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Obras Publicadas</span></div>
                        <div><span class="block font-black text-2xl text-slate-800">2.4k</span><span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Seguidores</span></div>
                    </div>
                </div>
                <button id="prof-follow-btn" class="bg-indigo-600 text-white px-12 py-5 rounded-2xl font-bold shadow-lg hover:shadow-indigo-200 transition-all active:scale-95 relative z-10">Seguir</button>
            </header>

            <div class="grid grid-cols-2 lg:grid-cols-3 gap-8" id="prof-gallery">
            </div>
        </div>

    </main>
</div>

<script>
    let stompClient = null;
    let unreadCount = 0;
    let state = {
        currentUser: "Juan David Ramírez",
        artworks: [],
        following: new Set(),
        suggestions: [
            { name: 'Elena Vector', color: 'bg-orange-500', role: 'Ilustradora' },
            { name: 'Marco Polo', color: 'bg-indigo-500', role: 'Diseñador 3D' },
            { name: 'Sara Art', color: 'bg-emerald-500', role: 'Concept Artist' }
        ]
    };

    // --- INICIO DE APP ---
    function startApp() {
        state.currentUser = document.getElementById('username').value;
        document.getElementById('user-name').innerText = state.currentUser;
        document.getElementById('user-avatar').innerText = state.currentUser.substring(0,2).toUpperCase();
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-app').classList.remove('hidden');
        renderSuggestions();
        connect();
    }

    // --- WEBSOCKETS (PUB-SUB) ---
    function connect() {
        const socket = new SockJS('/ws-bitpalette');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;
        stompClient.connect({}, () => {
            stompClient.subscribe('/topic/notifications', (msg) => {
                const data = JSON.parse(msg.body);
                state.artworks.unshift(data);

                // Si estamos en el feed, actualizarlo
                if(!document.getElementById('view-feed').classList.contains('hidden')) {
                    renderFeed();
                }

                // Actualizar Campana
                triggerBell(data.artist, data.name);
            });
        });
    }

    // --- LOGICA DE NOTIFICACIONES (CAMPANA) ---
    function triggerBell(artist, name) {
        unreadCount++;
        const badge = document.getElementById('notif-count');
        const bell = document.getElementById('bell-btn');

        badge.innerText = unreadCount;
        badge.classList.remove('hidden');
        bell.classList.add('animate-bell');
        setTimeout(() => bell.classList.remove('animate-bell'), 1000);

        // Añadir al panel
        document.getElementById('notif-empty').classList.add('hidden');
        const items = document.getElementById('notif-items');
        const div = document.createElement('div');
        div.className = "p-4 hover:bg-slate-50 border-b border-slate-50 cursor-pointer transition-all";
        div.innerHTML = `
                <p class="text-[11px] font-bold text-slate-800">${artist} publicó:</p>
                <p class="text-[10px] text-indigo-500 font-medium">${name}</p>
            `;
        items.prepend(div);
    }

    function toggleNotif() {
        const panel = document.getElementById('notif-panel');
        panel.classList.toggle('hidden');
        if(!panel.classList.contains('hidden')) {
            unreadCount = 0;
            document.getElementById('notif-count').classList.add('hidden');
        }
    }

    function clearNotifs() {
        document.getElementById('notif-items').innerHTML = '<p id="notif-empty" class="text-center text-slate-400 py-10 text-xs italic">No hay actividad nueva</p>';
    }

    // --- SUBIDA DE OBRA ---
    function previewFile() {
        const file = document.getElementById('file-input').files[0];
        const img = document.getElementById('img-preview');
        const icon = document.querySelector('#preview-container i');
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                img.src = e.target.result;
                img.classList.remove('hidden');
                icon.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }
    }

    function publish() {
        const name = document.getElementById('art-name').value;
        const fileInput = document.getElementById('file-input');
        if(!name || !fileInput.files[0]) return alert("Falta título o imagen");

        const reader = new FileReader();
        reader.onload = (e) => {
            const artworkData = {
                id: Date.now(),
                name: name,
                artist: state.currentUser,
                image: e.target.result, // Base64 real
                likes: 0,
                likedByMe: false
            };

            // Enviar vía Pub-Sub
            stompClient.send("/app/notif", {}, JSON.stringify(artworkData));

            // Limpiar campos
            document.getElementById('art-name').value = '';
            document.getElementById('file-input').value = '';
            document.getElementById('img-preview').classList.add('hidden');
            document.querySelector('#preview-container i').classList.remove('hidden');
        };
        reader.readAsDataURL(fileInput.files[0]);
    }

    // --- RENDERIZADO DE FEED Y LIKES ---
    function renderFeed() {
        const container = document.getElementById('feed-items');
        container.innerHTML = state.artworks.map(art => `
                <div class="bg-white rounded-[3rem] overflow-hidden border border-slate-100 shadow-sm transition-all hover:shadow-md animate-in slide-in-from-bottom-10">
                    <div class="p-8 flex items-center justify-between">
                        <div class="flex items-center gap-4 cursor-pointer group" onclick="viewProfile('${art.artist}')">
                            <div class="w-12 h-12 bg-slate-900 rounded-2xl flex items-center justify-center text-white font-bold text-sm shadow-lg">${art.artist.substring(0,2).toUpperCase()}</div>
                            <div>
                                <p class="font-bold text-slate-900 group-hover:text-indigo-600 transition-all">${art.artist}</p>
                                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Active Artist</p>
                            </div>
                        </div>
                    </div>
                    <div class="px-8 pb-8">
                        <img src="${art.image}" class="w-full h-[30rem] object-cover rounded-[2.5rem] shadow-inner bg-slate-50">
                        <div class="mt-8 flex justify-between items-center px-2">
                            <div>
                                <h3 class="font-black text-2xl text-slate-900">${art.name}</h3>
                                <p class="text-xs text-slate-400 font-medium">Digital Masterpiece • 2026</p>
                            </div>
                            <button onclick="toggleLike(${art.id})" class="flex items-center gap-3 bg-slate-50 px-6 py-3 rounded-2xl transition-all active:scale-90 group">
                                <i data-lucide="heart" class="w-6 h-6 transition-all ${art.likedByMe ? 'heart-active' : 'text-slate-300 group-hover:text-red-300'}"></i>
                                <span class="font-black text-lg ${art.likedByMe ? 'text-red-500' : 'text-slate-400'}">${art.likes}</span>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        lucide.createIcons();
    }

    function toggleLike(id) {
        const art = state.artworks.find(a => a.id === id);
        if(art) {
            if(art.likedByMe) { art.likes--; art.likedByMe = false; }
            else { art.likes++; art.likedByMe = true; }
            renderFeed();
            // Si estamos viendo un perfil, refrescar la galería también
            if(!document.getElementById('view-profile').classList.contains('hidden')) {
                viewProfile(document.getElementById('prof-name').innerText);
            }
        }
    }

    // --- SISTEMA DE PERFILES ---
    function viewProfile(artistName) {
        const profile = state.suggestions.find(s => s.name === artistName) || { name: artistName, color: 'bg-slate-900' };

        document.getElementById('view-feed').classList.add('hidden');
        document.getElementById('view-profile').classList.remove('hidden');
        document.getElementById('nav-feed').classList.remove('active-nav');

        document.getElementById('prof-name').innerText = profile.name;
        const avatar = document.getElementById('prof-avatar');
        avatar.innerText = profile.name.substring(0,2).toUpperCase();
        avatar.className = `w-40 h-40 rounded-[2.5rem] flex items-center justify-center text-5xl font-black text-white shadow-xl ${profile.color}`;

        // Filtrar galería
        const works = state.artworks.filter(a => a.artist === artistName);
        document.getElementById('prof-count').innerText = works.length;
        document.getElementById('prof-gallery').innerHTML = works.length === 0
            ? '<p class="col-span-3 text-center py-32 text-slate-300 italic font-bold">Aún no hay obras en este estudio.</p>'
            : works.map(w => `<div class="aspect-square rounded-[2rem] overflow-hidden shadow-lg border-4 border-white hover:scale-105 transition-all"><img src="${w.image}" class="w-full h-full object-cover"></div>`).join('');

        const btn = document.getElementById('prof-follow-btn');
        btn.innerText = state.following.has(artistName) ? "Siguiendo" : "Seguir";
        btn.className = state.following.has(artistName)
            ? "bg-slate-100 text-slate-400 px-12 py-5 rounded-2xl font-bold shadow-sm"
            : "bg-indigo-600 text-white px-12 py-5 rounded-2xl font-bold shadow-lg";

        btn.onclick = () => { toggleFollow(artistName); viewProfile(artistName); };
    }

    function showFeed() {
        document.getElementById('view-feed').classList.remove('hidden');
        document.getElementById('view-profile').classList.add('hidden');
        document.getElementById('nav-feed').classList.add('active-nav');
        renderFeed();
    }

    // --- SOCIAL (SEGUIR) ---
    function toggleFollow(name) {
        if(state.following.has(name)) state.following.delete(name);
        else state.following.add(name);
        renderSuggestions();
        renderFollowingSidebar();
    }

    function renderSuggestions() {
        document.getElementById('suggestions-list').innerHTML = state.suggestions.map(s => `
                <div class="flex items-center justify-between group">
                    <div class="flex items-center gap-4 cursor-pointer" onclick="viewProfile('${s.name}')">
                        <div class="w-12 h-12 ${s.color} rounded-2xl flex items-center justify-center text-white font-bold text-xs shadow-sm">${s.name.substring(0,2)}</div>
                        <div>
                            <p class="text-xs font-black group-hover:text-indigo-600 transition-all">${s.name}</p>
                            <p class="text-[10px] text-slate-400 font-bold uppercase">${s.role}</p>
                        </div>
                    </div>
                    <button onclick="toggleFollow('${s.name}')" class="text-[10px] font-black ${state.following.has(s.name) ? 'text-slate-300' : 'text-indigo-600'}">
                        ${state.following.has(s.name) ? 'SIGUIENDO' : 'SEGUIR'}
                    </button>
                </div>
            `).join('');
    }

    function renderFollowingSidebar() {
        const container = document.getElementById('following-list');
        if(state.following.size === 0) {
            container.innerHTML = '<p class="italic text-[11px] text-slate-300 px-4">No sigues a nadie aún</p>';
            return;
        }
        container.innerHTML = Array.from(state.following).map(name => `
                <div class="flex items-center gap-3 p-3 bg-slate-50 hover:bg-indigo-50 rounded-2xl cursor-pointer transition-all group" onclick="viewProfile('${name}')">
                    <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                    <span class="text-xs font-bold text-slate-600 group-hover:text-indigo-700">${name}</span>
                </div>
            `).join('');
    }

    // Iniciar iconos Lucide
    lucide.createIcons();
</script>
</body>
</html>
